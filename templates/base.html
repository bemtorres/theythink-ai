<!DOCTYPE html>
<html lang="es" class="dark">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}THEYTHINK AI · Intelligent Agents Platform{% endblock %}</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/theythinkai_logo.png') }}">

    <!-- Script anti-parpadeo para cargar el tema e idioma antes del renderizado -->
    <script>
      (function () {
        var tema = localStorage.getItem("tema_preferido") || localStorage.getItem("theythink_tema");
        if (tema === "light") {
          document.documentElement.classList.remove("dark");
        } else if (tema === "dark") {
          document.documentElement.classList.add("dark");
        } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }

        var lang = localStorage.getItem("theythink_lang") || "es";
        document.documentElement.lang = lang;
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["'Google Sans'", "Inter", "-apple-system", "BlinkMacSystemFont", "system-ui", "sans-serif"],
              mono: ["'JetBrains Mono'", "'Roboto Mono'", "monospace"],
            },
            colors: {
              google: {
                blue: "#1a73e8",
                blueLight: "#8ab4f8",
                red: "#ea4335",
                redLight: "#f28b82",
                yellow: "#fbbc04",
                yellowLight: "#fdd663",
                green: "#34a853",
                greenLight: "#81c995",
                purple: "#a142f4",
                purpleLight: "#d7aefb",
              },
            },
          },
        },
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <!-- Traducciones externas por vista (deben cargarse antes de i18n.js) -->
    <script src="{{ url_for('static', filename='js/i18n.extra.common.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.index.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.login.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.chat.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.dashboard.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.telegram.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.whatsapp.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.extra.terms.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}?v=2"></script>
  </head>

  <body class="min-h-screen bg-[#f8f9fa] text-[#202124] dark:bg-[#131314] dark:text-[#e3e3e3] font-sans antialiased transition-colors duration-200" {% block body_atributos %}{% endblock %}>

    {% block contenido %}{% endblock %}

    <script>
      // Lógica global para alternar entre Modo Claro y Modo Oscuro
      window.alternarTema = function () {
        var html = document.documentElement;
        var esOscuro = html.classList.toggle("dark");
        localStorage.setItem("tema_preferido", esOscuro ? "dark" : "light");
        actualizarIconosTema(esOscuro);
      };

      function actualizarIconosTema(esOscuro) {
        document.querySelectorAll(".btn-toggle-tema").forEach(function (btn) {
          var iconoSol = btn.querySelector(".icono-sol");
          var iconoLuna = btn.querySelector(".icono-luna");
          if (iconoSol && iconoLuna) {
            if (esOscuro) {
              iconoSol.classList.remove("hidden");
              iconoLuna.classList.add("hidden");
            } else {
              iconoSol.classList.add("hidden");
              iconoLuna.classList.remove("hidden");
            }
          }
        });
        if (window.lucide) lucide.createIcons();
      }

      document.addEventListener("DOMContentLoaded", function () {
        var esOscuro = document.documentElement.classList.contains("dark");
        actualizarIconosTema(esOscuro);
        if (window.lucide) lucide.createIcons();
      });
    </script>

    <!-- Aviso flotante (toast) Google Style -->
    <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[60] hidden -translate-x-1/2">
      <div id="toast-contenido" class="flex items-center gap-2.5 rounded-2xl bg-[#34a853] px-5 py-3 text-sm font-semibold text-white shadow-2xl">
        <i id="toast-icono" data-lucide="check-circle-2" class="h-4 w-4"></i>
        <span id="texto-toast"></span>
      </div>
    </div>

    <!-- Modal Global de Términos y Condiciones -->
    {% include "terminos_modal.html" %}

    {% block scripts %}{% endblock %}
  </body>

</html>
